<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Learning App</title>
    <link rel="stylesheet" type="text/css" href="../static/styles.css">
    <link rel="stylesheet" type="text/css" href="../static/index.css">
</head>
<body>
    <a href="/login" class="logout-button">Logout</a>

    <div class="container">
        <h1>Meine Lernziele</h1>
        <h2>Themen</h2>
        <ul id="topics-list">
        </ul>
        <h2>Lernziele</h2>
        <ul id="goals-list">
        </ul>

        <h2>Neues Thema hinzufügen</h2>
        <form id="create-topic-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="priority">Priorität:</label>
            <select id="priority" name="priority">
                <option value="high">Hoch</option>
                <option value="medium" selected>Mittel</option>
                <option value="low">Niedrig</option>
            </select>
            <br>
            <button type="submit">Thema hinzufügen</button>
        </form>

        <h2>Neues Lernziel hinzufügen</h2>
        <form id="create-goal-form">
            <label for="topic_id">Thema:</label>
            <select id="topic_id" name="topic_id" required>
                <option value="" disabled selected>Thema auswählen...</option>
            </select>
            <br>
            <label for="description">Beschreibung:</label>
            <input type="text" id="description" name="description" required>
            <br>
            <label for="deadline">Deadline:</label>
            <input type="date" id="deadline" name="deadline" required>
            <br>
            <button type="submit">Lernziel hinzufügen</button>
        </form>
    </div>

    <script>
        async function loadTopics() {
            try {
                const response = await fetch('/topics');
                const data = await response.json();
                const topicsList = document.getElementById('topics-list');
                topicsList.innerHTML = '';

                const topicDropdown = document.getElementById('topic_id');
                topicDropdown.innerHTML = '<option value="" disabled selected>Thema auswählen...</option>';

                data.forEach(topic => {
                    const listItem = document.createElement('li');
                    listItem.textContent = `${topic.name} (Priorität: ${topic.priority})`;
                    topicsList.appendChild(listItem);

                    const option = document.createElement('option');
                    option.value = topic.id;
                    option.textContent = topic.name;
                    topicDropdown.appendChild(option);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Themen:', error);
            }
        }

        async function loadGoals() {
            try {
                const response = await fetch('/learning_goals');
                const data = await response.json();
                const goalsList = document.getElementById('goals-list');
                goalsList.innerHTML = '';

                data.forEach(goal => {
                    const listItem = document.createElement('li');
                    listItem.textContent = `${goal.description} (Deadline: ${goal.deadline})`;
                    goalsList.appendChild(listItem);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Lernziele:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadTopics();
            loadGoals();
        });

        document.getElementById('create-topic-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = {
                name: document.getElementById('name').value,
                priority: document.getElementById('priority').value
            };

            try {
                const response = await fetch('/topics', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                const data = await response.json();
                console.log('Success:', data);
                loadTopics();
            } catch (error) {
                console.error('Error:', error);
            }
        });

        document.getElementById('create-goal-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = {
                topic_id: parseInt(document.getElementById('topic_id').value),
                description: document.getElementById('description').value,
                deadline: document.getElementById('deadline').value
            };

            try {
                const response = await fetch('/learning_goals', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                const data = await response.json();
                console.log('Success:', data);
                loadGoals();
            } catch (error) {
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
