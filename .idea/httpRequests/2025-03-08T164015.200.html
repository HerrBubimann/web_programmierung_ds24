<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Learning App</title>
    <link rel="stylesheet" type="text/css" href="../static/styles.css">
    <link rel="stylesheet" type="text/css" href="../static/index.css">
</head>
<body>
<a href="/logout" class="logout-button" id="logout-button">Logout</a>

<div class="container">
    <h1>Meine Lernziele</h1>
    <h2>Themen</h2>
    <ul id="topics-list">

    </ul>
    <h2>Lernziele</h2>
    <ul id="goals-list">

    </ul>

    <h2>Neues Thema hinzufügen</h2>
    <form id="add-topic-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="priority">Priorität:</label>
        <select id="priority" name="priority">
            <option value="high">Hoch</option>
            <option value="medium" selected>Mittel</option>
            <option value="low">Niedrig</option>
        </select>
        <br>
        <button type="submit">Thema hinzufügen</button>
    </form>

    <h2>Neues Lernziel hinzufügen</h2>
    <form id="add-goal-form">
        <label for="topic_id">Thema ID:</label>
        <input type="number" id="topic_id" name="topic_id" required>
        <br>
        <label for="description">Beschreibung:</label>
        <input type="text" id="description" name="description" required>
        <br>
        <label for="deadline">Deadline:</label>
        <input type="date" id="deadline" name="deadline" required>
        <br>
        <button type="submit">Lernziel hinzufügen</button>
    </form>
</div>

<script>
    const token = localStorage.getItem('token');

    if (!token) {
        window.location.href = '/login';
    }

    async function fetchWithToken(url, options = {}) {
        if (!options.headers) {
            options.headers = {};
        }
        options.headers['Authorization'] = token;
        return fetch(url, options);
    }

    // Logout-Button
    document.getElementById('logout-button').addEventListener('click', async (event) => {
        event.preventDefault();
        try {
            const response = await fetchWithToken('http://127.0.0.1:5001/logout', {
                method: 'POST',
            });
            if (response.ok) {
                localStorage.removeItem('token');
                window.location.href = '/login';
            } else {
                alert('Logout fehlgeschlagen');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Ein Fehler ist aufgetreten');
        }
    });

    document.getElementById('add-topic-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetchWithToken('http://127.0.0.1:5001/add-topic', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            });

            if (response.ok) {
                alert('Thema erfolgreich hinzugefügt');
                window.location.reload();
            } else {
                alert('Fehler beim Hinzufügen des Themas');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Ein Fehler ist aufgetreten');
        }
    });

    // Neues Lernziel hinzufügen
    document.getElementById('add-goal-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetchWithToken('http://127.0.0.1:5001/add-goal', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            });

            if (response.ok) {
                alert('Lernziel erfolgreich hinzugefügt');
                window.location.reload();
            } else {
                alert('Fehler beim Hinzufügen des Lernziels');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Ein Fehler ist aufgetreten');
        }
    });

    async function fetchData() {
        try {
            const topicsResponse = await fetchWithToken('http://127.0.0.1:5001/get-topics');
            const goalsResponse = await fetchWithToken('http://127.0.0.1:5001/get-goals');

            if (topicsResponse.ok && goalsResponse.ok) {
                const topics = await topicsResponse.json();
                const goals = await goalsResponse.json();

                const topicsList = document.getElementById('topics-list');
                const goalsList = document.getElementById('goals-list');

                topicsList.innerHTML = topics.map(topic => `
                        <li>${topic.name} (Priorität: ${topic.priority})</li>
                    `).join('');

                goalsList.innerHTML = goals.map(goal => `
                        <li>${goal.description} (Deadline: ${goal.deadline})</li>
                    `).join('');
            } else {
                alert('Fehler beim Laden der Daten');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Ein Fehler ist aufgetreten');
        }
    }

    fetchData();
</script>
</body>
</html>
