<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning App</title>
    <link rel="stylesheet" type="text/css" href="../static/styles.css">
    <link rel="stylesheet" type="text/css" href="../static/index.css">
</head>
<body>
    <a href="/login" class="logout-button">Logout</a>

    <div class="container">
        <h1>Meine Lernziele</h1>

        <div class="section">
            <h2>Themen</h2>
            <ul id="topics-list"></ul>
        </div>

        <div class="section">
            <h2>Lernziele</h2>
            <ul id="goals-list"></ul>
        </div>

        <div class="section">
            <h2>Neues Thema hinzufügen</h2>
            <form id="create-topic-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="priority">Priorität:</label>
                <select id="priority" name="priority">
                    <option value="hoch">Hoch</option>
                    <option value="mittel" selected>Mittel</option>
                    <option value="niedrig">Niedrig</option>
                </select>

                <button type="submit" class="btn">Thema hinzufügen</button>
            </form>
        </div>

        <div class="section">
            <h2>Neues Lernziel hinzufügen</h2>
            <form id="create-goal-form">
                <label for="topic_id">Thema:</label>
                <select id="topic_id" name="topic_id" required>
                    <option value="" disabled selected>Thema auswählen...</option>
                </select>

                <label for="description">Beschreibung:</label>
                <input type="text" id="description" name="description" required>

                <label for="deadline">Deadline:</label>
                <input type="date" id="deadline" name="deadline" required>

                <button type="submit" class="btn">Lernziel hinzufügen</button>
            </form>
        </div>
    </div>

    <script>
        async function loadTopics() {
            try {
                const response = await fetch('/topics');
                const data = await response.json();
                const topicsList = document.getElementById('topics-list');
                topicsList.innerHTML = '';

                const topicDropdown = document.getElementById('topic_id');
                topicDropdown.innerHTML = '<option value="" disabled selected>Thema auswählen...</option>';

                data.forEach(topic => {
                    const listItem = document.createElement('li');
                    listItem.textContent = `${topic.name} (Priorität: ${topic.priority})`;
                    topicsList.appendChild(listItem);

                    const option = document.createElement('option');
                    option.value = topic.id;
                    option.textContent = topic.name;
                    topicDropdown.appendChild(option);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Themen:', error);
            }
        }

        async function loadGoals() {
            try {
                const response = await fetch('/learning_goals');
                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('Server-Fehler:', errorData.error);
                    return;
                }

                const data = await response.json();
                const goalsList = document.getElementById('goals-list');
                goalsList.innerHTML = '';

                data.forEach(goal => {
                    const listItem = document.createElement('li');
                    listItem.textContent = `${goal.topic_name} ${goal.description} (Deadline: ${goal.deadline})`;
                    goalsList.appendChild(listItem);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Lernziele:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadTopics();
            loadGoals();
        });

        document.getElementById('create-topic-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = {
                title: document.getElementById('name').value,
                priority: document.getElementById('priority').value
            };

            try {
                const response = await fetch('/topics', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                if (!response.ok) {
                    throw new Error('Fehler beim Erstellen des Themas.');
                }

                await response.json();
                loadTopics();
            } catch (error) {
                console.error('Fehler:', error);
            }
        });

        document.getElementById('create-goal-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = {
                topic_id: document.getElementById('topic_id').value,
                description: document.getElementById('description').value,
                deadline: document.getElementById('deadline').value
            };

            try {
                const response = await fetch('/learning_goals', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                if (!response.ok) {
                    throw new Error('Fehler beim Erstellen des Lernziels.');
                }

                await response.json();
                loadGoals();
            } catch (error) {
                console.error('Fehler:', error);
            }
        });
    </script>
</body>
</html>
