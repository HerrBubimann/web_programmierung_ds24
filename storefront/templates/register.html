<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" type="text/css" href="../static/styles.css">
    <link rel="stylesheet" type="text/css" href="../static/register.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='register.css') }}">
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
</head>
<body>
    <div class="main">
        <p class="sign" align="center">Register</p>
        <form id="register-form" class="form1">
            <input class="un" type="text" id="username" placeholder="Username" required>
            <input class="un" type="email" id="email" placeholder="Email" required>
            <input class="pass" type="password" id="password" placeholder="Password" required>
            <input class="pass" type="password" id="confirm-password" placeholder="Confirm Password" required>
            <button type="submit" class="submit" align="center">Register</button>
        </form>
        <p class="register" align="center">Already have an account? <a href="/login">Login here</a></p>
    </div>

    <script>
        // Add event listener for form submission
        document.getElementById("register-form").addEventListener("submit", async function(event) {
            event.preventDefault(); // Prevent the default form submission

            // Get form values
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            // Check if passwords match
            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            // API call to submit registration details
            try {
                const response = await fetch('https://your-api-url.com/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, email, password }),
                });

                const data = await response.json();

                // Handle API response
                if (response.ok) {
                    // Redirect to another page upon successful registration
                    window.location.href = '/login.html'; // Replace with your desired redirect URL
                } else {
                    alert("Registration failed: " + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert("An error occurred during the registration process.");
            }
        });
    </script>
</body>
</html>
